# render.yaml — Render deployment configuration for OTP Ocean
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: otp-ocean-bot
    runtime: python
    region: singapore          # Closest to India — lowest latency for UPI/TG
    plan: free                 # Free tier (has sleep — handled by keep_alive.py)
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health   # Render pings this to check if app is alive

    # Auto-deploy on every push to main branch
    autoDeploy: true

    envVars:
      # These will be read from Render dashboard — DO NOT hardcode values here
      - key: BOT_TOKEN
        sync: false            # "sync: false" means you must set it in dashboard
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: LOG_GROUP
        sync: false
      - key: MONGO_URL
        sync: false
      - key: PORT
        value: "8080"          # Render auto-sets this but we pin it for safety
      - key: APP_URL
        sync: false            # Set to your Render URL after first deploy
      - key: PYTHON_VERSION
        value: "3.11.9"
